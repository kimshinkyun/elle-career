<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>법인전환 절세 시뮬레이터</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #1b4f9b;
  --primary-light: #2563eb;
  --accent: #f59e0b;
  --bg: #f0f4f8;
  --chat-bg: #ffffff;
  --bubble-me: #1b4f9b;
  --bubble-bot: #f1f5f9;
  --text: #1e293b;
  --muted: #64748b;
  --radius: 18px;
}

body {
  font-family: 'Malgun Gothic', -apple-system, sans-serif;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 0;
}

/* ── 헤더 ── */
.header {
  width: 100%;
  max-width: 480px;
  background: linear-gradient(135deg, #0f2d6b, #1b4f9b);
  color: white;
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.2);
}
.avatar {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.header-info h1 { font-size: 15px; font-weight: 700; }
.header-info p { font-size: 12px; opacity: 0.75; margin-top: 2px; }
.online-dot {
  width: 8px; height: 8px;
  background: #4ade80; border-radius: 50%;
  margin-left: auto; flex-shrink: 0;
  box-shadow: 0 0 6px #4ade80;
}

/* ── 채팅 영역 ── */
.chat-area {
  width: 100%;
  max-width: 480px;
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  background: var(--bg);
  min-height: calc(100vh - 130px);
}

/* ── 말풍선 ── */
.msg-row {
  display: flex;
  margin-bottom: 14px;
  animation: fadeUp 0.3s ease;
}
.msg-row.bot { align-items: flex-end; }
.msg-row.user { flex-direction: row-reverse; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bot-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #1b4f9b, #2563eb);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; margin-right: 8px; margin-bottom: 2px;
}

.bubble {
  max-width: 78%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.65;
  position: relative;
  word-break: break-word;
}
.bubble.bot {
  background: white;
  color: var(--text);
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.bubble.user {
  background: var(--bubble-me);
  color: white;
  border-bottom-right-radius: 4px;
}

/* ── 버튼 그룹 ── */
.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 6px 0 10px 40px;
  animation: fadeUp 0.3s ease;
}
.choice-btn {
  background: white;
  border: 2px solid var(--primary);
  color: var(--primary);
  padding: 9px 16px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.choice-btn:hover { background: var(--primary); color: white; }
.choice-btn:disabled { opacity: 0.4; cursor: default; }

/* ── 타이핑 인디케이터 ── */
.typing {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  animation: fadeUp 0.3s ease;
}
.typing .dots {
  background: white;
  padding: 12px 16px;
  border-radius: var(--radius);
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  display: flex; gap: 5px; align-items: center;
}
.typing .dot {
  width: 8px; height: 8px;
  background: #94a3b8;
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing .dot:nth-child(2) { animation-delay: 0.2s; }
.typing .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* ── 결과 카드 ── */
.result-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  margin: 4px 0;
  max-width: 100%;
  animation: fadeUp 0.4s ease;
}
.result-header {
  background: linear-gradient(135deg, #0f2d6b, #1b4f9b);
  color: white;
  padding: 16px 18px 14px;
  font-size: 15px;
  font-weight: 700;
}
.result-header span { font-size: 12px; font-weight: 400; opacity: 0.8; display: block; margin-top: 2px; }
.result-body { padding: 18px; }

.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-bottom: 16px;
}
.compare-table th {
  background: #f8fafc;
  padding: 8px 10px;
  text-align: center;
  font-weight: 700;
  color: var(--muted);
  border-bottom: 2px solid #e2e8f0;
}
.compare-table th.corp { color: var(--primary); }
.compare-table td {
  padding: 9px 10px;
  border-bottom: 1px solid #f1f5f9;
  text-align: right;
}
.compare-table td:first-child { text-align: left; color: var(--muted); font-size: 12px; }
.compare-table .total td { font-weight: 700; border-top: 2px solid #e2e8f0; }
.compare-table .corp-val { color: var(--primary); font-weight: 600; }
.compare-table .save { color: #16a34a; font-weight: 700; }

.savings-box {
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  border: 2px solid #6ee7b7;
  border-radius: 12px;
  padding: 14px 16px;
  text-align: center;
  margin-bottom: 14px;
}
.savings-box .label { font-size: 12px; color: #065f46; margin-bottom: 4px; }
.savings-box .amount { font-size: 26px; font-weight: 900; color: #065f46; }
.savings-box .sub { font-size: 11px; color: #047857; margin-top: 4px; }

.cta-btn {
  display: block;
  width: 100%;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  margin-top: 4px;
  font-family: inherit;
  transition: transform 0.1s;
}
.cta-btn:hover { transform: scale(1.02); }

.restart-btn {
  display: block;
  width: 100%;
  background: #f1f5f9;
  color: var(--primary);
  border: 2px solid var(--primary);
  padding: 11px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  margin-top: 8px;
  font-family: inherit;
}

/* ── 날짜 구분 ── */
.date-divider {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin: 10px 0 16px;
  background: #e2e8f0;
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  width: 100%;
}

/* ── 입력창 ── */
.input-area {
  width: 100%;
  max-width: 480px;
  background: white;
  border-top: 1px solid #e2e8f0;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  bottom: 0;
}
.input-area input {
  flex: 1;
  border: 1.5px solid #e2e8f0;
  border-radius: 24px;
  padding: 10px 16px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  color: var(--text);
  background: #f8fafc;
}
.input-area input:focus { border-color: var(--primary); background: white; }
.send-btn {
  width: 42px; height: 42px;
  background: var(--primary);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

@media (max-width: 480px) {
  .chat-area { padding: 16px 12px; }
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="avatar">💼</div>
  <div class="header-info">
    <h1>법인전환 절세 시뮬레이터</h1>
    <p>무료 · 5분 진단 · 전문 컨설턴트 연결</p>
  </div>
  <div class="online-dot"></div>
</div>

<!-- 채팅 영역 -->
<div class="chat-area" id="chatArea"></div>

<!-- 입력창 -->
<div class="input-area">
  <input type="text" id="userInput" placeholder="메시지를 입력하세요..." disabled>
  <button class="send-btn" id="sendBtn" disabled>➤</button>
</div>

<script>
// ══════════════════════════════════════════════
// 세금 계산 엔진
// ══════════════════════════════════════════════

const COST_RATIO = {
  '제조업': 0.70, '도소매업': 0.78, '음식업/요식업': 0.68,
  '병원/의원': 0.62, '건설/인테리어': 0.73, '서비스업': 0.68
};

const REVENUE_MAP = {
  '3억 미만': 250000000, '3~5억': 400000000,
  '5~10억': 750000000, '10억 이상': 1500000000
};

const SALARY_MAP = {
  '연 2,400만원': 24000000, '연 3,600만원': 36000000,
  '연 4,800만원': 48000000, '연 6,000만원': 60000000
};

function calcIncomeTax(income) {
  if (income <= 0) return 0;
  const brackets = [
    [14000000, 0.06, 0],
    [50000000, 0.15, 1260000],
    [88000000, 0.24, 5760000],
    [150000000, 0.35, 15440000],
    [300000000, 0.38, 19940000],
    [500000000, 0.40, 25940000],
    [Infinity,  0.45, 35940000],
  ];
  for (const [limit, rate, ded] of brackets) {
    if (income <= limit) return Math.max(0, income * rate - ded);
  }
}

function calcCorpTax(profit) {
  if (profit <= 0) return 0;
  if (profit <= 200000000) return profit * 0.09;
  return 200000000 * 0.09 + (profit - 200000000) * 0.19;
}

function calcEmployeeTax(salary) {
  let ded;
  if (salary <= 5000000)        ded = salary * 0.7;
  else if (salary <= 15000000)  ded = 3500000 + (salary - 5000000) * 0.4;
  else if (salary <= 45000000)  ded = 7500000 + (salary - 15000000) * 0.15;
  else if (salary <= 100000000) ded = 12000000 + (salary - 45000000) * 0.05;
  else                          ded = 14750000 + (salary - 100000000) * 0.02;

  const taxable = Math.max(0, salary - ded - 1500000); // 기본공제
  return calcIncomeTax(taxable);
}

function simulate(industry, revenueKey, salaryKey) {
  const revenue  = REVENUE_MAP[revenueKey];
  const cRatio   = COST_RATIO[industry] || 0.68;
  const cost     = revenue * cRatio;
  const income   = revenue - cost;          // 개인 사업소득
  const salary   = SALARY_MAP[salaryKey];

  // ── 개인사업자 ──
  const indivIncomeTax = calcIncomeTax(income);
  const indivHealth    = income * 0.0709;   // 지역가입자 약 7.09%
  const indivTotal     = indivIncomeTax + indivHealth;

  // ── 법인사업자 ──
  const corpProfit     = income - salary;   // 법인 순이익
  const corpTax        = calcCorpTax(Math.max(0, corpProfit));
  const ceoTax         = calcEmployeeTax(salary);
  const ceoHealth      = salary * 0.03545;  // 직장가입자 본인 부담
  const retirement     = salary / 12;       // 연간 퇴직금 적립
  const corpTotal      = corpTax + ceoTax + ceoHealth;

  const saving         = indivTotal - corpTotal;
  const saving10y      = saving * 10;

  return {
    revenue, income, salary,
    indivIncomeTax, indivHealth, indivTotal,
    corpTax, ceoTax, ceoHealth, retirement, corpTotal,
    saving, saving10y
  };
}

// ══════════════════════════════════════════════
// 챗봇 엔진
// ══════════════════════════════════════════════

const state = {};

const STEPS = [
  {
    key: 'intro',
    bot: ['안녕하세요! 👋\n저는 <b>법인전환 절세 시뮬레이터</b>입니다.\n\n사장님의 업종과 매출만 입력하시면\n<b>법인전환 시 예상 절세액을 무료로 계산</b>해드립니다.\n\n5분이면 충분합니다. 시작해볼까요?'],
    choices: ['네, 시작할게요! 🚀', '법인전환이 뭔가요?'],
    next: (v) => v === '법인전환이 뭔가요?' ? 'explain' : 'industry'
  },
  {
    key: 'explain',
    bot: ['법인전환이란? 📚\n\n개인사업자(자영업)를 <b>주식회사·유한회사</b> 형태로 바꾸는 것입니다.\n\n✅ 법인세율(9~19%) < 소득세율(최고 45%)\n✅ 대표 급여를 비용으로 처리\n✅ 건강보험료 50% 절감\n✅ 퇴직금 합법 적립\n\n연매출 3억 이상이면 대부분 유리합니다!'],
    choices: ['그럼 계산해볼게요!'],
    next: () => 'industry'
  },
  {
    key: 'industry',
    bot: ['먼저 업종을 선택해주세요! 🏭'],
    choices: ['제조업', '도소매업', '음식업/요식업', '병원/의원', '건설/인테리어', '서비스업'],
    next: () => 'revenue',
    save: 'industry'
  },
  {
    key: 'revenue',
    bot: ['연 매출 규모는 어떻게 되세요? 💰'],
    choices: ['3억 미만', '3~5억', '5~10억', '10억 이상'],
    next: () => 'salary',
    save: 'revenue'
  },
  {
    key: 'salary',
    bot: ['현재 대표님이 가져가시는\n연간 수입(생활비)은 얼마나 되세요? 💳\n\n(법인 전환 후 급여 설계에 활용됩니다)'],
    choices: ['연 2,400만원', '연 3,600만원', '연 4,800만원', '연 6,000만원'],
    next: () => 'calculating',
    save: 'salary'
  },
  {
    key: 'calculating',
    bot: ['감사합니다! ✨\n입력하신 정보로 절세액을 계산하고 있습니다...\n잠시만 기다려주세요 🔄'],
    choices: [],
    next: () => 'result'
  },
  {
    key: 'result',
    isResult: true,
    next: () => 'contact'
  },
  {
    key: 'contact',
    bot: ['위 시뮬레이션은 <b>추정 계산값</b>이며\n실제 절세액은 전문 상담으로 정확히 확인하실 수 있습니다.\n\n무료 상담을 원하시면 아래를 선택해주세요 😊'],
    choices: ['📞 전화 상담 신청', '💬 카카오톡 상담', '🔄 다시 계산하기'],
    next: (v) => {
      if (v === '🔄 다시 계산하기') return 'restart';
      return 'confirm_contact';
    }
  },
  {
    key: 'confirm_contact',
    bot: ['상담 신청 감사합니다! 🙏\n\n담당 컨설턴트가 곧 연락드립니다.\n\n📞 연락처: <b>[전화번호를 입력하세요]</b>\n💬 카카오채널: <b>[채널명을 입력하세요]</b>\n\n평일 09:00~18:00 운영\n강요 없는 100% 무료 상담입니다.'],
    choices: ['🔄 다시 계산하기', '✅ 확인했습니다'],
    next: (v) => v === '🔄 다시 계산하기' ? 'restart' : 'end'
  },
  {
    key: 'end',
    bot: ['감사합니다! 좋은 하루 되세요 😊\n궁금한 점이 있으면 언제든 다시 질문해주세요!'],
    choices: ['🔄 처음부터 다시'],
    next: () => 'restart'
  }
];

const stepMap = {};
STEPS.forEach(s => stepMap[s.key] = s);

let currentStep = 'intro';
let allBtnsDisabled = false;

const chatArea = document.getElementById('chatArea');

function fmt(n) {
  return Math.round(n / 10000).toLocaleString() + '만원';
}

function addDateDivider() {
  const now = new Date();
  const d = chatArea.querySelector('.date-divider');
  if (!d) {
    const div = document.createElement('div');
    div.className = 'date-divider';
    const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    div.textContent = now.toLocaleDateString('ko-KR', opts);
    chatArea.appendChild(div);
  }
}

function addBotBubble(html, delay = 0) {
  return new Promise(resolve => {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = `
      <div class="bot-icon">💼</div>
      <div class="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
    chatArea.appendChild(typing);
    scrollBottom();

    setTimeout(() => {
      typing.remove();
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.innerHTML = `
        <div class="bot-icon">💼</div>
        <div class="bubble bot">${html.replace(/\n/g, '<br>')}</div>`;
      chatArea.appendChild(row);
      scrollBottom();
      resolve();
    }, delay + 800);
  });
}

function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble user">${text}</div>`;
  chatArea.appendChild(row);
  scrollBottom();
}

function addButtons(choices, onSelect) {
  const grp = document.createElement('div');
  grp.className = 'btn-group';
  choices.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = label;
    btn.onclick = () => {
      grp.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      addUserBubble(label);
      onSelect(label);
    };
    grp.appendChild(btn);
  });
  chatArea.appendChild(grp);
  scrollBottom();
}

function addResultCard(r) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';

  const savingPositive = r.saving > 0;
  const savingClass = savingPositive ? 'save' : '';
  const savingLabel = savingPositive ? '절세액' : '추가 세금';
  const savingSign  = savingPositive ? '-' : '+';

  row.innerHTML = `
    <div class="bot-icon" style="align-self:flex-start;margin-top:4px">💼</div>
    <div style="flex:1;min-width:0">
      <div class="result-card">
        <div class="result-header">
          📊 절세 시뮬레이션 결과
          <span>${state.industry} · 매출 ${state.revenue} · 급여 ${state.salary}</span>
        </div>
        <div class="result-body">

          <table class="compare-table">
            <tr>
              <th></th>
              <th>개인사업자<br>(현재)</th>
              <th class="corp">법인사업자<br>(전환 후)</th>
            </tr>
            <tr>
              <td>소득세 / 법인세</td>
              <td>${fmt(r.indivIncomeTax)}</td>
              <td class="corp-val">${fmt(r.corpTax + r.ceoTax)}</td>
            </tr>
            <tr>
              <td>건강보험료</td>
              <td>${fmt(r.indivHealth)}</td>
              <td class="corp-val">${fmt(r.ceoHealth)}</td>
            </tr>
            <tr>
              <td>퇴직금 적립</td>
              <td>—</td>
              <td class="corp-val" style="color:#2563eb">+${fmt(r.retirement)}</td>
            </tr>
            <tr class="total">
              <td>연간 세금 합계</td>
              <td><b>${fmt(r.indivTotal)}</b></td>
              <td class="corp-val"><b>${fmt(r.corpTotal)}</b></td>
            </tr>
          </table>

          ${savingPositive ? `
          <div class="savings-box">
            <div class="label">💰 예상 연간 절세액</div>
            <div class="amount">${fmt(r.saving)}</div>
            <div class="sub">10년 누적 절세 효과: 약 ${fmt(r.saving10y)}</div>
          </div>
          ` : `
          <div class="savings-box" style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#f59e0b">
            <div class="label" style="color:#92400e">⚠️ 현재 매출 규모에서는</div>
            <div class="amount" style="color:#92400e;font-size:20px">법인전환 효과가 낮을 수 있습니다</div>
            <div class="sub" style="color:#b45309">전문가 상담으로 정확히 확인하세요</div>
          </div>
          `}

          <button class="cta-btn" onclick="selectChoice('📞 전화 상담 신청')">
            📞 무료 전문 상담 받기
          </button>
          <button class="restart-btn" onclick="restartChat()">🔄 다시 계산하기</button>
        </div>
      </div>
    </div>`;

  chatArea.appendChild(row);
  scrollBottom();
}

function scrollBottom() {
  setTimeout(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 50);
}

async function goStep(key) {
  currentStep = key;

  if (key === 'restart') {
    restartChat();
    return;
  }

  const step = stepMap[key];
  if (!step) return;

  if (step.isResult) {
    await addBotBubble('계산 완료! 아래 결과를 확인하세요 👇', 1200);
    const r = simulate(state.industry, state.revenue, state.salary);
    addResultCard(r);
    setTimeout(() => goStep(step.next()), 600);
    return;
  }

  for (let i = 0; i < step.bot.length; i++) {
    await addBotBubble(step.bot[i], i === 0 ? (key === 'calculating' ? 1500 : 200) : 500);
  }

  if (key === 'calculating') {
    setTimeout(() => goStep(step.next()), 1800);
    return;
  }

  if (step.choices && step.choices.length > 0) {
    addButtons(step.choices, (val) => selectChoice(val));
  }
}

function selectChoice(val) {
  const step = stepMap[currentStep];
  if (!step) return;

  if (step.save) {
    state[step.save] = val;
  }

  const next = step.next ? step.next(val) : null;
  if (next) goStep(next);
}

window.selectChoice = selectChoice;

function restartChat() {
  Object.keys(state).forEach(k => delete state[k]);
  chatArea.innerHTML = '';
  addDateDivider();
  goStep('intro');
}

window.restartChat = restartChat;

// ── 시작 ──
addDateDivider();
goStep('intro');
</script>
</body>
</html>
